<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table-component</title>
    <script type="module" src="./src/data-grid.ts"></script>
    <style>
      /*body {*/
      /*  font-family: system-ui, sans-serif;*/
      /*  margin: 0;*/
      /*  background: #fafafa;*/
      /*  color: #1a1a1a;*/
      /*}*/
      table {
        font-family: system-ui, sans-serif;
        border-collapse: collapse;
        min-width: 400px;
      }
      th, td {
        padding: 0.6rem 1rem;
        text-align: left;
      }
      th {
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #666;
        border-bottom: 2px solid #e0e0e0;
      }
      td {
        border-bottom: 1px solid #eee;
      }
      tr:hover td {
        background: #f0f0f0;
      }
      button {
        padding: 0.3rem 0.8rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; justify-content: center; width: 100%; margin-top: 4em">
      <data-grid id="data_grid">
        <template sort-asc>
          &uarr;
        </template>
        <template sort-desc>
          &darr;
        </template>
        <data-col field="id" label="ID" sortable></data-col>
        <data-col field="name" label="Name" sortable></data-col>
        <data-col field="actions">
          <button bind-data-name="name" onclick="dup(this.dataset.name)">
            click
          </button>
        </data-col>
      </data-grid>
    </div>
    <script>
      document.getElementById("data_grid").data = [
        {
          id: 1,
          name: "Dita"
        },
        {
          id: 2,
          name: "Peter"
        },
        {
          id: 3,
          name: "Suki"
        },
        {
          id: 4,
          name: "Takumi"
        },
        {
          id: 5,
          name: "Mogi"
        }
      ]

      function dup(name) {
        const grid = document.getElementById("data_grid")
        grid.data = [...grid.data, {
          id: grid.data.at(-1).id + 1,
          name: name
        }]
      }
    </script>
  </body>
</html>
